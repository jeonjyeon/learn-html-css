<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>폼 요소(input)</title>
    <link rel="shortcut icon" href="/public/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="../../public/favicon/likelion.svg" type="image/svg" />
    <link rel="preload" as="font" href="../../public/font/suit/SUIT-Variable.woff2" />
    <link rel="stylesheet" href="../../public/font/suit/SUIT-Variable.css" />
    <style>
      body {
        font-family: 'SUIT Variable', sans-serif;
      }
    </style>
  </head>
  <body>
    <a href="../../index.html">메인 페이지 이동</a>
    <br />
    <h1>폼 요소(input)</h1>
    <form action="https://formspree.io/f/xeqwwbwk" method="POST">
      <!-- 한 줄 글 상자 검색어 입력 서식 -->
      <!-- text: 텍스트 입력 서식 -->
      <!-- 폼 관련 요소는 일대일 대응되는 레이블을 반드시 가져야함. -->
      <div>
        <label for="userName">이름</label>
        <input type="text" id="userName" name="name" />
      </div>
      <!-- password: 비밀번호 입력 서식 -->
      <div>
        <label for="userPassword">비밀번호</label>
        <input type="text" id="userPassword" name="password" />
      </div>
      <!-- search: 검색어 입력 서식 -->
      <div>
        <label for="searchKeyword">검색어</label>
        <input type="search" id="searchKeyword" placeholder="검색어를 입력하세요" name="keyword" />
      </div>
      <!-- tel: 전화번호 입력 서식(HTML5에서 추가됨) -->
      <div>
        <label for="userPhone">전화번호</label>
        <input required type="tel" name="" id="userPhone" />
      </div>
      <!-- email: 이메일 입력 서식(HTML5에서 추가됨) -->
      <div>
        <label for="userEmail">이메일</label>
        <input required type="email" name="" id="userEmail" />
      </div>
      <!-- checkbox 서식-->
      <div>
        <input type="checkbox" value="html" name="bootcamp" id="bootcampHtml" />
        <label for="bootcampHtml">HTML</label>
      </div>
      <div>
        <label for="bootcampCss">CSS</label>
        <input type="checkbox" value="css" name="bootcamp" id="bootcampCss" />
      </div>
      <!-- radio 서식 -->
      <div>
        <label>
          <input type="radio" name="classRoom" id="classRoom1" />
          회고 1팀
        </label>
      </div>
      <div>
        <label>
          <input type="radio" name="classRoom" id="classRoom2" />
          회고 2팀
        </label>
      </div>
      <!-- 버튼(submit 전송, reset 초기화, button 일반버튼) - 검색 버튼 -->
      <div><input type="submit" value="전송" /></div>
      <div><input type="reset" value="초기화" /></div>
      <div><input type="button" value="버튼" /></div>
    </form>
  </body>
</html>
